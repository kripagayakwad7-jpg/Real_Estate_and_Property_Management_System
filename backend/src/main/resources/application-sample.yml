server:
  port: 8080

spring:
  application:
    name: real-estate-management

  datasource:
    url: jdbc:mysql://localhost:3306/real_estate_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: YOUR_MYSQL_PASSWORD_HERE
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  jackson:
    serialization:
      fail-on-empty-beans: false

logging:
  level:
    com.realestate: DEBUG
    org.hibernate.SQL: DEBUG
